# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# always refer to Hyprland wiki
# https://wiki.hyprland.org/
debug {
    damage_tracking = 0
}
# Initial boot script enable to apply initial wallpapers, theming, new settings etc.
# suggest not to change this or delete this including deleting referrence file in ~/.config/hypr/.initial_startup_done
# as long as the referrence file is present, this initial-boot.sh will not execute
exec-once = $HOME/.config/hypr/initial-boot.sh

# Sourcing external config files
$configs = $HOME/.config/hypr/configs # Default Configs directory path
env = __NV_PRIME_RENDER_OFFLOAD,1
env = __VK_LAYER_NV_optimus,NVIDIA_only
source=$configs/Keybinds.conf # Pre-configured keybinds
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# ## This is where you want to start tinkering
$UserConfigs = $HOME/.config/hypr/UserConfigs # User Configs directory path

source= $UserConfigs/Startup_Apps.conf # put your start-up packages on this file

source= $UserConfigs/ENVariables.conf # Environment variables to load

#source= $UserConfigs/Monitors.conf # Its all about your monitor config (old dots) will remove on push to main
#source= $UserConfigs/WorkspaceRules.conf # Hyprland workspaces (old dots) will remove on push to main

source= $UserConfigs/Laptops.conf # For laptop related

source= $UserConfigs/LaptopDisplay.conf # Laptop display related. You need to read the comment on this file

source= $UserConfigs/WindowRules.conf # all about Hyprland Window Rules and Layer Rules

source= $UserConfigs/UserDecorations.conf # Decorations config file

source= $UserConfigs/UserAnimations.conf # Animation config file

source= $UserConfigs/UserKeybinds.conf # Put your own keybinds here

source= $UserConfigs/UserSettings.conf # Main Hyprland Settings.

source= $UserConfigs/01-UserDefaults.conf # settings for User defaults apps

# nwg-displays
source= $HOME/.config/hypr/monitors.conf
source= $HOME/.config/hypr/workspaces.conf

bind = SUPER,DELETE,exec,~/.config/rofi/powermenu.sh

bind = SUPER, minus, exec, ~/.config/hypr/scripts/gaps.sh --dec_out
bind = SUPER, equal, exec, ~/.config/hypr/scripts/gaps.sh --inc_out
source = ~/.config/hypr/environment.conf
# check check check check check
# MEDIUM movement: CTRL + Shift + Arrow (similar to keypad movement)
binde = CTRL_SHIFT, RIGHT, exec, sudo ydotool mousemove -- 40 0 && sleep 0.1  # Right
binde = CTRL_SHIFT, LEFT, exec, sudo ydotool mousemove -- -40 0 && sleep 0.1  # Left
binde = CTRL_SHIFT, UP, exec, sudo ydotool mousemove -- 0 -40 && sleep 0.1  # Up
binde = CTRL_SHIFT, DOWN, exec, sudo ydotool mousemove -- 0 40 && sleep 0.1  # Down

# EXTRA FINE movement: CTRL + Shift + Alt + Arrow (micro movements)
binde = CTRL_SHIFT_ALT, RIGHT, exec, sudo ydotool mousemove -- 5 0 && sleep 0.1  # Right
binde = CTRL_SHIFT_ALT, LEFT, exec, sudo ydotool mousemove -- -5 0 && sleep 0.1  # Left
binde = CTRL_SHIFT_ALT, UP, exec, sudo ydotool mousemove -- 0 -5 && sleep 0.1  # Up
binde = CTRL_SHIFT_ALT, DOWN, exec, sudo ydotool mousemove -- 0 5 && sleep 0.1  # Down
bind = CTRL_SHIFT_ALT, RETURN, exec, sudo ydotool click C0  # Left click
# RIGHT CLICK: Super + Ctrl + Shift + Alt + Return
bind = SUPER_CTRL_SHIFT``, RETURN, exec, sudo ydotool click C1
env = WLR_DRM_DEVICES,/dev/dri/card2:/dev/dri/card1

# example Hyprland config snippet (~/.config/hypr/hyprland.conf)
binde = , KP_Home, exec, sudo ydotool mousemove -- -40 -40 && sleep 0.1   # Left-Up
binde = , KP_Prior, exec, sudo ydotool mousemove -- 40 -40 && sleep 0.1   # Right-Up
binde = , KP_End, exec, sudo ydotool mousemove -- -40 40 && sleep 0.1     # Left-Down
binde = , KP_Next, exec, sudo ydotool mousemove -- 40 40 && sleep 0.1     # Right-Down
binde = , KP_Left, exec, sudo ydotool mousemove -- -40 0 && sleep 0.1  # Left
binde = , KP_Right, exec, sudo ydotool mousemove -- 40 0 && sleep 0.1  # Right
binde = , KP_Up, exec, sudo ydotool mousemove -- 0 -40 && sleep 0.1  # Up
binde = , KP_Down, exec, sudo ydotool mousemove -- 0 40 && sleep 0.1  # Down
bind = , KP_Begin, exec, sudo ydotool click C0
bind = , KP_Divide, exec, sudo ydotool click 0x40
bind = , KP_Multiply, exec, sudo ydotool click 0x42 0x82
bind = , KP_Subtract, exec, sudo ydotool click 0x41 0x81
bind = , KP_Insert, exec, sudo sh -c 'if [ "$(cat /tmp/mouse_state)" = "40" ]; then echo "80" > /tmp/mouse_state && ydotool click 0x80; else echo "40" > /tmp/mouse_state && ydotool click 0x40; fi'
binde = SHIFT, KP_Home, exec, sudo ydotool mousemove -- -10 -10 && sleep 0.1   # Left-Up
binde = SHIFT, KP_Prior, exec, sudo ydotool mousemove -- 10 -10 && sleep 0.1   # Right-Up
binde = SHIFT, KP_End, exec, sudo ydotool mousemove -- -10 10 && sleep 0.1     # Left-Do>
binde = SHIFT, KP_Next, exec, sudo ydotool mousemove -- 10 10 && sleep 0.1     # Right-D>
binde = SHIFT, KP_Left, exec, sudo ydotool mousemove -- -10 0 && sleep 0.1  # Left
binde = SHIFT, KP_Right, exec, sudo ydotool mousemove -- 10 0 && sleep 0.1  # Right
binde = SHIFT, KP_Up, exec, sudo ydotool mousemove -- 0 -10 && sleep 0.1  # Up
binde = SHIFT, KP_Down, exec, sudo ydotool mousemove -- 0 10 && sleep 0.1  # Down
bind = SHIFT, KP_Begin, exec, sudo ydotool click C0
bind = SHIFT, KP_Divide, exec, sudo ydotool click 0x40
bind = SHIFT, KP_Multiply, exec, sudo ydotool click 0x42 0x82
bind = SHIFT, KP_Subtract, exec, sudo ydotool click 0x41 0x81

windowrulev2 = size 1280 720, class:^(java|logisim).*$


# Set window size to 1280x720
windowrule = tile, title:^(.*Digital.*)$
windowrule = tile, title:^(.*Logisim-evolution.*)$
windowrule = tile, title:^(.*ghidra.*)$
windowrule = tile, title:^(.*Ghidra.*)$
windowrule = tile, title:^(.*Kvantum.*)$
windowrule = tile, title:^(.*godot.*)$
windowrule = tile, title:^(.*Godot.*)$
#monitor = , addreserved, 16,0,0,0
layerrule = blur, swaync-control-center
windowrule = tile, title:^(.*toolbox.*)$
windowrule = tile, title:^(.*JetBrains.*)$
windowrule = tile, title:^(.*jetbrains.*)$
windowrule = tile, title:^(.*imhex.*)$
windowrule = tile, title:^(.*ImHex.*)$
windowrule = tile, title:^(.*zoom.*)$
windowrule = tile, title:^(.*Zoom.*)$
bind = SUPER, F, exec, sh -c "grim - | wl-copy"
windowrule = tile, title:^(.*CodeBrowser.*)$
windowrulev2 = float, title:^(Save|Open|Warning|Confirm|New).*
windowrulev2 = size 40% 20%, title:^(Save|Open|Warning|Confirm|New).*
windowrulev2 = center, title:^(Save|Open|Warning|Confirm|New).*
windowrulev2 = workspace unset, class:^(discord)$
windowrulev2 = tile, class:^(zathura)$
bind = $mainMod, E, exec, kitty yazi
windowrulev2 = tile, class:^(ImHex|imhex|Imhex)$
windowrulev2 = tile, class:^(org.pwmt.zathura)$

#monitor=eDP-1, 1920x1080@90.01, 0x0, 1

misc {
    vrr = 0
    # Optional: Disable Variable Frame Rate (power saving)
   # x vfr = false
}
#env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card2
# Force Nvidia as the primary DRM device
#env = WLR_DRM_DEVICES,/dev/dri/card1:/dev/dri/card2
env = WLR_DRM_DEVICES,$HOME/.config/hypr/nvidia_card:$HOME/.config/hypr/intel_card
# Essential Nvidia Wayland Fixes for v0.39
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1


decoration {
    # ... other stuff
    drop_shadow = true


    blur {
        enabled = true
        size = 3           # Small size = less texture sampling
        passes = 2         # The "sweet spot" for iGPUs
        new_optimizations = true
        xray = true        # Better performance with floating windows
    }
}
env = WLR_DRM_NO_ATOMIC,1
misc {
vfr = false
}
#windowrulev2 = noanim, class:^(vesktop)$

bind = ALT_R, f, exec, ~/wl-kbptr/build/wl-kbptr -o "modes=tile,bisect"
bind = ALT_R, f, submap, mouse_mode
bind = ALT_R, b, exec, ~/wl-kbptr/build/wl-kbptr -o modes=bisect
bind = ALT_R, b, submap, mouse_mode

submap = mouse_mode

# 1. THE CLICK HACK: Map Enter to ydotool
# This bypasses wl-kbptr's internal (broken) click and uses the kernel
bind = , period, exec, sudo ydotool click C0
bind = , period, exec, pkill wl-kbptr
bind = , period, submap, reset
# Right Click (,)
bind = , comma, exec, sudo ydotool click C1
bind = , comma, exec, pkill wl-kbptr
bind = , comma, submap, reset

# Middle Click (/)
bind = , slash, exec, YDOTOOL_SOCKET=/tmp/ydotoolsok ydotool click C2
bind = , slash, exec, pkill wl-kbptr
bind = , slash, submap, reset# 2. THE MOVEMENT: Let wl-kbptr see the keys (hjkl, etc.)
# We use 'pass' so the keystrokes go to the overlay window
bindn = , catchall, pass, ^(wl-kbptr)$

# 3. THE ESCAPE: Cancel everything
bind = , escape, exec, pkill wl-kbptr
bind = , escape, submap, reset

submap = reset
windowrulev2 = float, class:(one.alynx.showmethekey)
windowrulev2 = noborder, class:(one.alynx.showmethekey)
windowrulev2 = noshadow, class:(one.alynx.showmethekey)
windowrulev2 = pin, class:(one.alynx.showmethekey)
windowrulev2 = move 50% 85%, class:(one.alynx.showmethekey)
windowrulev2 = size 600 150, class:(one.alynx.showmethekey)
windowrulev2 = noinitialfocus, class:(one.alynx.showmethekey)
